name: CI Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Job de test et lint backend/shared
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test # Assurez-vous d'avoir ce script dans package.json
      - run: npm run lint # Assurez-vous d'avoir ce script

  # Job de packaging du code source
  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Create Zip Archive
        run: |
          # Exclure node_modules, dossiers inutiles et certificats
          zip -r project.zip . -x "node_modules/*" ".git/*" "mobile/build/*" "client/dist/*" "server/cert/*"
      - uses: actions/upload-artifact@v4
        with:
          name: project-source
          path: project.zip
          retention-days: 7
