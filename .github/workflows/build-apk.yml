name: Build APK Release

on:
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - "scripts/bump-mobile-version.mjs"
      - "package.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Install Flutter dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build release APK (version auto-bump)
        run: npm run apk

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep '^version:' mobile/pubspec.yaml | awk '{print $2}')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📱 Version buildée : $VERSION"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: takymed-apk-${{ steps.version.outputs.name }}
          path: takymed.apk
          retention-days: 90
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "### APK TAKYMED prête" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version** : \`${{ steps.version.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Fichier** : \`takymed.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Téléchargement** : onglet *Actions* → ce workflow → section *Artifacts*" >> "$GITHUB_STEP_SUMMARY"
