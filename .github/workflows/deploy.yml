name: Deploy (push.sh)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client sshpass

      - name: Write .env from secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "❌ Secret ENV_FILE manquant. Ajoutez le contenu complet de votre .env dans Settings → Secrets → ENV_FILE"
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" > .env
          chmod 600 .env

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          fi
          SERVER_IP=$(grep -E '^SERVER_IP=' .env | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'")
          if [ -n "$SERVER_IP" ]; then
            ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

      - name: Deploy with push.sh
        run: bash scripts/push.sh

      - name: Deployment summary
        if: success()
        run: |
          DOMAIN=$(grep -E '^DOMAIN=' .env | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'")
          PORT=$(grep -E '^PORT=' .env | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'")
          SERVER_IP=$(grep -E '^SERVER_IP=' .env | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'")
          HOST="${DOMAIN:-$SERVER_IP}"
          echo "🚀 Déploiement réussi sur http://${HOST}:${PORT:-3500}"
