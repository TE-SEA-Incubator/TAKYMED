name: Build Android Release (APK + AAB)

on:
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - "scripts/bump-mobile-version.mjs"
      - "scripts/read-mobile-version.mjs"
      - "package.json"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Install Flutter dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build APK + AAB (version auto-bump unique)
        run: npm run mobile:release

      - name: Read app version
        id: version
        run: |
          DISPLAY=$(node scripts/read-mobile-version.mjs --display)
          BUILD=$(node scripts/read-mobile-version.mjs --build)
          echo "display=$DISPLAY" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "📱 Version buildée : v$DISPLAY (build Android $BUILD)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: takymed-apk-${{ steps.version.outputs.display }}
          path: takymed.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload AAB artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: takymed-aab-${{ steps.version.outputs.display }}
          path: takymed.aab
          retention-days: 90
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "### Release Android TAKYMED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version** : \`v${{ steps.version.outputs.display }}\` (build Android ${{ steps.version.outputs.build }}) — APK et AAB synchronisés" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK** : \`takymed.apk\` — tests / distribution directe" >> "$GITHUB_STEP_SUMMARY"
          echo "- **AAB** : \`takymed.aab\` — Google Play Console" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Téléchargement** : onglet *Artifacts* de ce workflow" >> "$GITHUB_STEP_SUMMARY"
