name: Build AAB Release (Play Store)

on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Install Flutter dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build release AAB
        run: npm run aab

      - name: Read app version
        id: version
        run: |
          DISPLAY=$(node scripts/read-mobile-version.mjs --display)
          echo "display=$DISPLAY" >> "$GITHUB_OUTPUT"
          echo "📱 Version AAB : v$DISPLAY"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: takymed-aab-${{ steps.version.outputs.display }}
          path: takymed.aab
          retention-days: 90
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "### AAB TAKYMED (Play Store)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version** : \`v${{ steps.version.outputs.display }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Fichier** : \`takymed.aab\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Play Console** : Production → Créer une version → Importer l'AAB" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Pour APK + AAB **même version** : workflow *Build Android Release (APK + AAB)* ou \`npm run mobile:release\`" >> "$GITHUB_STEP_SUMMARY"
